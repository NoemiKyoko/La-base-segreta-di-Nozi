<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Base Segreta di Nozi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8f2;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base-stage {
      position: relative;
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base-wrapper {
      position: relative;

      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;
    }

    .base-image {
      display: block;
      width: 100%;
      height: 100%;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot-layer {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 10;
    }

    .hotspot {
      fill: transparent;
      cursor: pointer;
      pointer-events: all;
    }

    /* =========================
       PANNELLI TEST
    ========================== */

    .overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(245, 235, 230, 0.68);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      z-index: 100;
    }

    .overlay.aperto {
      display: flex;
    }

    .panel {
      width: min(520px, 82vw);
      padding: 32px;

      background: #fff8f3;
      border: 2px solid #e8b59b;
      border-radius: 28px;

      box-shadow: 0 18px 50px rgba(70, 55, 80, 0.18);

      text-align: center;
    }

    .panel h1 {
      margin: 0 0 24px;

      color: #173f7a;

      font-size: clamp(28px, 4vw, 42px);
    }

    .close-button {
      appearance: none;

      border: 0;
      border-radius: 18px;

      padding: 14px 24px;

      background: #f3c2aa;
      color: #173f7a;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }


    /* =========================
       SCHERMATE ARCHIVIO
    ========================== */

    .archive-screen {
      position: fixed;
      inset: 0;

      display: none;
      flex-direction: column;

      z-index: 200;

      overflow: hidden;
    }

    .archive-screen.aperto {
      display: flex;
    }

    .archive-screen.documents {
      background: #eaf6fb;
    }

    .archive-screen.projects {
      background: #eef8ef;
    }

    .archive-header {
      display: flex;
      align-items: center;
      gap: 18px;

      padding:
        max(20px, env(safe-area-inset-top))
        26px
        18px;

      border-bottom: 1px solid rgba(23, 63, 122, 0.10);
    }

    .archive-screen.documents .archive-header {
      background: #d8eef7;
    }

    .archive-screen.projects .archive-header {
      background: #dcefdc;
    }

    .archive-back,
    .archive-add {
      appearance: none;
      border: 0;

      width: 50px;
      height: 50px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.72);
      color: #173f7a;

      font-size: 30px;
      line-height: 1;

      cursor: pointer;

      box-shadow: 0 5px 14px rgba(50, 65, 80, 0.10);
    }

    .archive-title {
      flex: 1;

      margin: 0;

      color: #173f7a;

      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
    }

    .archive-content {
      flex: 1;
      overflow-y: auto;

      padding: 30px;
    }

    .archive-empty {
      min-height: 60%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(23, 63, 122, 0.58);

      font-size: 18px;
      text-align: center;
    }

    .archive-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(190px, 1fr));

      gap: 22px;
    }

    .archive-card {
      appearance: none;

      border: 1px solid rgba(23, 63, 122, 0.10);
      border-radius: 22px;

      padding: 14px;

      background: rgba(255, 255, 255, 0.78);

      box-shadow:
        0 8px 20px rgba(58, 70, 90, 0.10);

      text-align: left;
      cursor: pointer;
    }

    .archive-preview {
      width: 100%;
      aspect-ratio: 4 / 3;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 12px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.95);

      overflow: hidden;

      color: #173f7a;
      font-size: 42px;
    }

    .archive-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .archive-name {
      display: block;

      color: #173f7a;

      font-size: 16px;
      font-weight: 600;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-input {
      display: none;
    }
  </style>
</head>

<body>

  <main class="base-stage">

    <div class="base-wrapper">

      <img
        class="base-image"
        src="assets/base-segreta-nozi.png"
        alt="La Base Segreta di Nozi"
      >

      <svg
        class="hotspot-layer"
        viewBox="0 0 1536 1024"
        preserveAspectRatio="none"
      >

        <!-- =========================
             LIBRERIA DESTRA
        ========================== -->

        <!-- LEZIONI & MATERIALI -->
        <rect
          class="hotspot"
          data-target="overlayLessons"
          x="1235"
          y="170"
          width="270"
          height="155"
        />

        <!-- DOCUMENTI IMPORTANTI -->
        <rect
          class="hotspot"
          data-archive="documentsScreen"
          x="1235"
          y="335"
          width="270"
          height="155"
        />

        <!-- ATTIVITÀ & PROGETTI -->
        <rect
          class="hotspot"
          data-archive="projectsScreen"
          x="1235"
          y="500"
          width="270"
          height="155"
        />

        <!-- IDEE & ISPIRAZIONI -->
        <rect
          class="hotspot"
          data-target="overlayIdeas"
          x="1235"
          y="665"
          width="270"
          height="145"
        />

        <!-- STICKER DI NOZI -->
        <rect
          class="hotspot"
          data-target="overlayStickers"
          x="1235"
          y="810"
          width="270"
          height="170"
        />


        <!-- =========================
             ZONA CENTRALE
        ========================== -->

        <!-- PROGRAMMAZIONE -->
        <rect
          class="hotspot"
          data-target="overlayPlanning"
          x="425"
          y="290"
          width="235"
          height="195"
        />

        <!-- ORARIO SCOLASTICO -->
        <rect
          class="hotspot"
          data-target="overlaySchedule"
          x="670"
          y="290"
          width="230"
          height="195"
        />

        <!-- DA NON DIMENTICARE -->
        <rect
          class="hotspot"
          data-target="overlayRemember"
          x="915"
          y="290"
          width="235"
          height="195"
        />

        <!-- QUADERNO DELLE COSE BUFFE -->
        <rect
          class="hotspot"
          data-target="overlayNotebook"
          x="790"
          y="580"
          width="330"
          height="245"
        />

        <!-- COMPUTER / REGISTRO -->
        <rect
          class="hotspot"
          data-url="https://www.portaleargo.it/"
          x="535"
          y="690"
          width="230"
          height="175"
        />

      </svg>

    </div>

  </main>


  <!-- =========================
       PANNELLI TEST
  ========================== -->

  <div class="overlay" id="overlayLessons">
    <section class="panel">
      <h1>Lezioni &amp; Materiali</h1>
      <button class="close-button">Chiudi</button>
    </section>
  </div>

  <div class="overlay" id="overlayIdeas">
    <section class="panel">
      <h1>Idee &amp; Ispirazioni</h1>
      <button class="close-button">Chiudi</button>
    </section>
  </div>

  <div class="overlay" id="overlayStickers">
    <section class="panel">
      <h1>Sticker di Nozi</h1>
      <button class="close-button">Chiudi</button>
    </section>
  </div>

  <div class="overlay" id="overlayPlanning">
    <section class="panel">
      <h1>Programmazione</h1>
      <button class="close-button">Chiudi</button>
    </section>
  </div>

  <div class="overlay" id="overlaySchedule">
    <section class="panel">
      <h1>Orario scolastico</h1>
      <button class="close-button">Chiudi</button>
    </section>
  </div>

  <div class="overlay" id="overlayRemember">
    <section class="panel">
      <h1>Da non dimenticare</h1>
      <button class="close-button">Chiudi</button>
    </section>
  </div>

  <div class="overlay" id="overlayNotebook">
    <section class="panel">
      <h1>Quaderno delle cose buffe</h1>
      <button class="close-button">Chiudi</button>
    </section>
  </div>


  <!-- =========================
       DOCUMENTI IMPORTANTI
  ========================== -->

  <section
    class="archive-screen documents"
    id="documentsScreen"
  >

    <header class="archive-header">

      <button
        class="archive-back"
        data-close-archive
        aria-label="Torna alla Base"
      >
        ‹
      </button>

      <h1 class="archive-title">
        Documenti importanti
      </h1>

      <button
        class="archive-add"
        data-file-picker="documentsInput"
        aria-label="Aggiungi documento"
      >
        +
      </button>

    </header>

    <div class="archive-content">

      <div
        class="archive-empty"
        id="documentsEmpty"
      >
        Nessun documento ancora.
      </div>

      <div
        class="archive-grid"
        id="documentsGrid"
      ></div>

    </div>

    <input
      class="file-input"
      id="documentsInput"
      type="file"
      multiple
    >

  </section>


  <!-- =========================
       ATTIVITÀ & PROGETTI
  ========================== -->

  <section
    class="archive-screen projects"
    id="projectsScreen"
  >

    <header class="archive-header">

      <button
        class="archive-back"
        data-close-archive
        aria-label="Torna alla Base"
      >
        ‹
      </button>

      <h1 class="archive-title">
        Attività &amp; Progetti
      </h1>

      <button
        class="archive-add"
        data-file-picker="projectsInput"
        aria-label="Aggiungi attività o progetto"
      >
        +
      </button>

    </header>

    <div class="archive-content">

      <div
        class="archive-empty"
        id="projectsEmpty"
      >
        Nessuna attività o progetto ancora.
      </div>

      <div
        class="archive-grid"
        id="projectsGrid"
      ></div>

    </div>

    <input
      class="file-input"
      id="projectsInput"
      type="file"
      multiple
    >

  </section>


  <script>

    /* =========================
       HOTSPOT DELLA BASE
    ========================== */

    const hotspots =
      document.querySelectorAll(".hotspot");

    const overlays =
      document.querySelectorAll(".overlay");

    const closeButtons =
      document.querySelectorAll(".close-button");


    hotspots.forEach((hotspot) => {

      hotspot.addEventListener("click", () => {

        const url =
          hotspot.dataset.url;

        if (url) {

          window.open(
            url,
            "_blank",
            "noopener,noreferrer"
          );

          return;
        }


        const archiveId =
          hotspot.dataset.archive;

        if (archiveId) {

          const archive =
            document.getElementById(archiveId);

          archive.classList.add("aperto");

          return;
        }


        const targetId =
          hotspot.dataset.target;

        const targetOverlay =
          document.getElementById(targetId);

        if (targetOverlay) {
          targetOverlay.classList.add("aperto");
        }

      });

    });


    /* =========================
       CHIUSURA PANNELLI TEST
    ========================== */

    closeButtons.forEach((button) => {

      button.addEventListener("click", () => {

        button
          .closest(".overlay")
          .classList.remove("aperto");

      });

    });


    overlays.forEach((overlay) => {

      overlay.addEventListener("click", (event) => {

        if (event.target === overlay) {
          overlay.classList.remove("aperto");
        }

      });

    });


    /* =========================
       CHIUSURA ARCHIVI
    ========================== */

    const archiveBackButtons =
      document.querySelectorAll(
        "[data-close-archive]"
      );

    archiveBackButtons.forEach((button) => {

      button.addEventListener("click", () => {

        button
          .closest(".archive-screen")
          .classList.remove("aperto");

      });

    });


    /* =========================
       APERTURA FILE PICKER
    ========================== */

    const addButtons =
      document.querySelectorAll(
        "[data-file-picker]"
      );

    addButtons.forEach((button) => {

      button.addEventListener("click", () => {

        const inputId =
          button.dataset.filePicker;

        document
          .getElementById(inputId)
          .click();

      });

    });


    /* =========================
       CREA CARD ARCHIVIO
    ========================== */

    function creaCard(file) {

      const card =
        document.createElement("button");

      card.className = "archive-card";


      const preview =
        document.createElement("div");

      preview.className = "archive-preview";


      const name =
        document.createElement("span");

      name.className = "archive-name";
      name.textContent = file.name;


      if (file.type.startsWith("image/")) {

        const image =
          document.createElement("img");

        const objectUrl =
          URL.createObjectURL(file);

        image.src = objectUrl;
        image.alt = "";

        preview.appendChild(image);

        card.addEventListener("click", () => {
          window.open(objectUrl, "_blank");
        });

      } else {

        preview.textContent = "📄";

        const objectUrl =
          URL.createObjectURL(file);

        card.addEventListener("click", () => {
          window.open(objectUrl, "_blank");
        });

      }


      card.appendChild(preview);
      card.appendChild(name);

      return card;
    }


    /* =========================
       GESTIONE ARCHIVIO
    ========================== */

    function collegaArchivio(
      inputId,
      gridId,
      emptyId
    ) {

      const input =
        document.getElementById(inputId);

      const grid =
        document.getElementById(gridId);

      const empty =
        document.getElementById(emptyId);


      input.addEventListener("change", () => {

        const files =
          Array.from(input.files);


        if (files.length === 0) {
          return;
        }


        empty.style.display = "none";


        files.forEach((file) => {

          const card =
            creaCard(file);

          grid.appendChild(card);

        });


        input.value = "";

      });

    }


    collegaArchivio(
      "documentsInput",
      "documentsGrid",
      "documentsEmpty"
    );


    collegaArchivio(
      "projectsInput",
      "projectsGrid",
      "projectsEmpty"
    );

  </script>

</body>
</html>
