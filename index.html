<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Base Segreta di Nozi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8f2;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =========================
       BASE
    ========================== */

    .base-stage {
      position: relative;
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base-wrapper {
      position: relative;
      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;
    }

    .base-image {
      display: block;
      width: 100%;
      height: 100%;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot-layer {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 10;
    }

    .hotspot {
      fill: transparent;
      cursor: pointer;
      pointer-events: all;
    }


    /* =========================
       PANNELLI TEST
    ========================== */

    .overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(245, 235, 230, 0.68);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      z-index: 100;
    }

    .overlay.aperto {
      display: flex;
    }

    .panel {
      width: min(520px, 82vw);
      padding: 32px;

      background: #fff8f3;
      border: 2px solid #e8b59b;
      border-radius: 28px;

      box-shadow: 0 18px 50px rgba(70, 55, 80, 0.18);

      text-align: center;
    }

    .panel h1 {
      margin: 0 0 24px;

      color: #173f7a;

      font-size: clamp(28px, 4vw, 42px);
    }

    .close-button {
      appearance: none;
      border: 0;
      border-radius: 18px;

      padding: 14px 24px;

      background: #f3c2aa;
      color: #173f7a;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }


    /* =========================
       ARCHIVI
    ========================== */

    .archive-screen {
      position: fixed;
      inset: 0;

      display: none;
      flex-direction: column;

      z-index: 200;

      overflow: hidden;
    }

    .archive-screen.aperto {
      display: flex;
    }

    .archive-screen.documents {
      background: #eaf6fb;
    }

    .archive-screen.projects {
      background: #eef8ef;
    }

    .archive-header {
      display: flex;
      align-items: center;
      gap: 18px;

      padding:
        max(20px, env(safe-area-inset-top))
        26px
        18px;

      border-bottom: 1px solid rgba(23, 63, 122, 0.10);
    }

    .archive-screen.documents .archive-header {
      background: #d8eef7;
    }

    .archive-screen.projects .archive-header {
      background: #dcefdc;
    }

    .archive-back,
    .archive-add {
      appearance: none;
      border: 0;

      width: 50px;
      height: 50px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.72);
      color: #173f7a;

      font-size: 30px;
      line-height: 1;

      cursor: pointer;

      box-shadow: 0 5px 14px rgba(50, 65, 80, 0.10);
    }

    .archive-title {
      flex: 1;

      margin: 0;

      color: #173f7a;

      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
    }

    .archive-content {
      flex: 1;
      overflow-y: auto;

      padding: 30px;
    }

    .archive-empty {
      min-height: 60%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(23, 63, 122, 0.58);

      font-size: 18px;
      text-align: center;
    }

    .archive-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(190px, 1fr));

      gap: 22px;
    }


    /* =========================
       CARD ARCHIVI
    ========================== */

    .archive-card {
      position: relative;

      border: 1px solid rgba(23, 63, 122, 0.10);
      border-radius: 22px;

      padding: 14px;

      background: rgba(255, 255, 255, 0.78);

      box-shadow:
        0 8px 20px rgba(58, 70, 90, 0.10);
    }

    .archive-open {
      appearance: none;
      border: 0;

      width: 100%;
      padding: 0;

      background: transparent;

      text-align: left;
      cursor: pointer;
    }

    .archive-preview {
      width: 100%;
      aspect-ratio: 4 / 3;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 12px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.95);

      overflow: hidden;

      color: #173f7a;
      font-size: 42px;
    }

    .archive-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .archive-name {
      display: block;

      padding-right: 38px;

      color: #173f7a;

      font-size: 16px;
      font-weight: 600;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-menu-button {
      position: absolute;
      right: 10px;
      bottom: 8px;

      appearance: none;
      border: 0;

      width: 36px;
      height: 36px;

      border-radius: 12px;

      background: transparent;
      color: #173f7a;

      font-size: 24px;

      cursor: pointer;
    }

    .card-menu {
      position: absolute;

      right: 10px;
      bottom: 48px;

      display: none;

      min-width: 120px;

      padding: 7px;

      border: 1px solid rgba(23, 63, 122, 0.10);
      border-radius: 14px;

      background: #fffaf6;

      box-shadow:
        0 8px 22px rgba(50, 60, 75, 0.17);

      z-index: 5;
    }

    .card-menu.aperto {
      display: block;
    }

    .delete-button {
      appearance: none;
      border: 0;

      width: 100%;

      padding: 10px 14px;

      border-radius: 10px;

      background: transparent;
      color: #8f3d3d;

      font-size: 15px;
      font-weight: 600;

      text-align: left;

      cursor: pointer;
    }

    .file-input {
      display: none;
    }


    /* =========================
       IDEE & ISPIRAZIONI
    ========================== */

    .ideas-screen {
      position: fixed;
      inset: 0;

      display: none;
      flex-direction: column;

      z-index: 240;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #eee9f8 0%,
          #f7f3fb 100%
        );
    }

    .ideas-screen.aperto {
      display: flex;
    }

    .ideas-header {
      display: flex;
      align-items: center;
      gap: 16px;

      padding:
        max(18px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        16px
        max(22px, env(safe-area-inset-left));

      background: #e2daf2;

      border-bottom:
        1px solid rgba(73, 57, 112, 0.10);
    }

    .ideas-back,
    .ideas-add,
    .ideas-delete {
      appearance: none;
      border: 0;

      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.72);
      color: #4c4274;

      font-size: 28px;
      line-height: 1;

      cursor: pointer;

      box-shadow:
        0 5px 14px rgba(65, 55, 90, 0.10);
    }

    .ideas-delete {
      font-size: 21px;
    }

    .ideas-title {
      flex: 1;

      margin: 0;

      color: #4c4274;

      font-size: clamp(25px, 4vw, 40px);
      font-weight: 700;
    }

    .ideas-workspace {
      flex: 1;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 22px;

      overflow: hidden;
    }

    .notebook {
      width: min(900px, 94vw);
      height: min(690px, calc(100vh - 150px));

      min-height: 300px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      border:
        1px solid rgba(80, 65, 120, 0.12);

      border-radius: 28px;

      background: #faf8fd;

      box-shadow:
        0 18px 45px rgba(67, 57, 95, 0.16);
    }

    .notebook-top {
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px 18px;

      background: #d9cfed;

      border-bottom:
        1px solid rgba(80, 65, 120, 0.10);
    }

    .page-navigation {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 14px;
    }

    .page-arrow {
      appearance: none;
      border: 0;

      width: 38px;
      height: 38px;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.72);
      color: #4c4274;

      font-size: 25px;
      line-height: 1;

      cursor: pointer;
    }

    .page-arrow:disabled {
      opacity: 0.30;
      cursor: default;
    }

    .page-counter {
      min-width: 70px;

      color: #4c4274;

      font-size: 15px;
      font-weight: 700;

      text-align: center;
    }

    .idea-page-wrap {
      position: relative;

      flex: 1;
      min-height: 0;

      overflow: hidden;

      background-color: #fffdfd;

      background-image:
        radial-gradient(
          circle,
          rgba(111, 93, 150, 0.22) 1.2px,
          transparent 1.3px
        );

      background-size:
        24px 24px;

      background-position:
        12px 12px;
    }

    .idea-textarea {
      position: absolute;
      inset: 0;

      z-index: 1;

      width: 100%;
      height: 100%;

      resize: none;

      border: 0;
      outline: 0;

      padding: 34px 38px;

      background: transparent;

      color: #3e3852;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size: 19px;
      line-height: 1.75;

      caret-color: #66568c;
    }

    .idea-textarea::placeholder {
      color: rgba(76, 66, 116, 0.36);
    }


    /* Sticker appoggiati sulla pagina */

    .idea-sticker-layer {
      position: absolute;
      inset: 0;

      z-index: 2;

      display: flex;
      flex-wrap: wrap;

      align-content: flex-end;
      justify-content: flex-end;

      gap: 9px;

      padding: 28px;

      pointer-events: none;
    }

    .idea-page-sticker {
      display: block;

      width: clamp(72px, 11vw, 125px);
      height: clamp(72px, 11vw, 125px);

      object-fit: contain;

      filter:
        drop-shadow(
          0 4px 5px
          rgba(60, 50, 80, 0.12)
        );

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       GALLERIA STICKER
    ========================== */

    .stickers-screen {
      position: fixed;
      inset: 0;

      display: none;
      flex-direction: column;

      z-index: 250;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #e7f3fb 0%,
          #f4f0fb 100%
        );
    }

    .stickers-screen.aperto {
      display: flex;
    }

    .stickers-header {
      display: flex;
      align-items: center;
      gap: 18px;

      padding:
        max(20px, env(safe-area-inset-top))
        26px
        18px;

      background: #dcecf8;

      border-bottom:
        1px solid rgba(23, 63, 122, 0.10);
    }

    .stickers-back {
      appearance: none;
      border: 0;

      width: 50px;
      height: 50px;

      flex: 0 0 50px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.76);
      color: #173f7a;

      font-size: 30px;
      line-height: 1;

      cursor: pointer;

      box-shadow:
        0 5px 14px rgba(50, 65, 80, 0.10);
    }

    .stickers-heading {
      flex: 1;
      min-width: 0;
    }

    .stickers-title {
      margin: 0;

      color: #173f7a;

      font-size: clamp(25px, 4vw, 40px);
      font-weight: 700;
    }

    .stickers-subtitle {
      margin: 5px 0 0;

      color: rgba(23, 63, 122, 0.62);

      font-size: 14px;
    }

    .stickers-content {
      flex: 1;

      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

      padding:
        28px
        max(22px, env(safe-area-inset-right))
        max(30px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
    }

    .stickers-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));

      gap: 20px;

      max-width: 1200px;
      margin: 0 auto;
    }

    .sticker-card {
      appearance: none;
      border:
        1px solid rgba(23, 63, 122, 0.10);

      width: 100%;

      padding: 12px;

      border-radius: 24px;

      background: rgba(255, 255, 255, 0.76);

      box-shadow:
        0 8px 20px rgba(58, 70, 90, 0.09);

      cursor: pointer;

      text-align: center;
    }

    .sticker-card:active {
      transform: scale(0.98);
    }

    .sticker-image-box {
      width: 100%;
      aspect-ratio: 1 / 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 8px;

      border-radius: 18px;

      background: rgba(255, 255, 255, 0.64);

      overflow: hidden;
    }

    .sticker-image {
      display: block;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .sticker-label {
      display: block;

      margin-top: 10px;

      color: #173f7a;

      font-size: 14px;
      font-weight: 600;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    /* =========================
       ANTEPRIMA STICKER
    ========================== */

    .sticker-viewer {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: rgba(38, 46, 67, 0.58);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      z-index: 400;
    }

    .sticker-viewer.aperto {
      display: flex;
    }

    .sticker-viewer-card {
      position: relative;

      width: min(560px, 92vw);
      max-height: 90vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 24px;

      border-radius: 30px;

      background: #fffaf7;

      box-shadow:
        0 22px 60px rgba(30, 35, 55, 0.28);
    }

    .sticker-viewer-close {
      position: absolute;
      top: 14px;
      right: 14px;

      appearance: none;
      border: 0;

      width: 42px;
      height: 42px;

      border-radius: 14px;

      background: #edf3fa;
      color: #173f7a;

      font-size: 24px;

      cursor: pointer;
    }

    .sticker-viewer-image-box {
      width: min(380px, 70vw);
      height: min(380px, 55vh);

      display: flex;
      align-items: center;
      justify-content: center;

      margin-top: 18px;
    }

    .sticker-viewer-image {
      display: block;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
    }

    .sticker-viewer-name {
      margin: 14px 0 18px;

      color: #173f7a;

      font-size: 18px;
      font-weight: 700;

      text-align: center;
    }

    .sticker-actions {
      width: 100%;

      display: flex;
      justify-content: center;

      gap: 12px;
    }

    .sticker-action {
      appearance: none;
      border: 0;

      min-width: 120px;

      padding: 13px 22px;

      border-radius: 15px;

      background: #dcecf8;
      color: #173f7a;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    .sticker-action.secondary {
      background: #f3ddd2;
    }


    /* =========================
       DESTINAZIONE STICKER
    ========================== */

    .destination-overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: rgba(38, 46, 67, 0.62);

      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);

      z-index: 500;
    }

    .destination-overlay.aperto {
      display: flex;
    }

    .destination-card {
      position: relative;

      width: min(500px, 92vw);

      padding: 30px;

      border-radius: 28px;

      background: #fffaf7;

      box-shadow:
        0 22px 60px rgba(30, 35, 55, 0.30);
    }

    .destination-close {
      position: absolute;
      top: 14px;
      right: 14px;

      appearance: none;
      border: 0;

      width: 42px;
      height: 42px;

      border-radius: 14px;

      background: #edf3fa;
      color: #173f7a;

      font-size: 24px;

      cursor: pointer;
    }

    .destination-title {
      margin: 4px 45px 24px 0;

      color: #173f7a;

      font-size: 23px;
      line-height: 1.25;
    }

    .destination-list {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .destination-button {
      appearance: none;
      border:
        1px solid rgba(23, 63, 122, 0.10);

      width: 100%;

      padding: 15px 17px;

      border-radius: 15px;

      background: #f4f7fb;
      color: #173f7a;

      font-size: 16px;
      font-weight: 600;

      text-align: left;

      cursor: pointer;
    }


    /* =========================
       TOAST
    ========================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom:
        max(28px, env(safe-area-inset-bottom));

      transform:
        translateX(-50%)
        translateY(20px);

      max-width: min(520px, 88vw);

      padding: 13px 20px;

      border-radius: 16px;

      background: #173f7a;
      color: white;

      font-size: 15px;
      font-weight: 600;

      text-align: center;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;

      z-index: 600;
    }

    .toast.visibile {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =========================
       SCHERMI STRETTI
    ========================== */

    @media (max-width: 700px) {

      .stickers-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 14px;
      }

      .stickers-content {
        padding: 18px;
      }

      .sticker-actions {
        flex-direction: column;
      }

      .sticker-action {
        width: 100%;
      }

      .ideas-header {
        gap: 9px;
      }

      .ideas-back,
      .ideas-add,
      .ideas-delete {
        width: 43px;
        height: 43px;
        flex-basis: 43px;
      }

      .ideas-title {
        font-size: 22px;
      }

      .ideas-workspace {
        padding: 12px;
      }

      .notebook {
        width: 100%;
        height: calc(100vh - 125px);

        border-radius: 22px;
      }

      .idea-textarea {
        padding: 27px 25px;

        font-size: 18px;
      }

      .idea-sticker-layer {
        padding: 18px;
        gap: 6px;
      }

      .idea-page-sticker {
        width: 82px;
        height: 82px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       BASE
  ========================== -->

  <main class="base-stage">

    <div class="base-wrapper">

      <img
        class="base-image"
        src="assets/base-segreta-nozi.png"
        alt="La Base Segreta di Nozi"
      >

      <svg
        class="hotspot-layer"
        viewBox="0 0 1536 1024"
        preserveAspectRatio="none"
      >

        <!-- LEZIONI & MATERIALI -->

        <rect
          class="hotspot"
          data-target="overlayLessons"
          x="1235"
          y="170"
          width="270"
          height="155"
        />


        <!-- DOCUMENTI IMPORTANTI -->

        <rect
          class="hotspot"
          data-archive="documentsScreen"
          x="1235"
          y="335"
          width="270"
          height="155"
        />


        <!-- ATTIVITÀ & PROGETTI -->

        <rect
          class="hotspot"
          data-archive="projectsScreen"
          x="1235"
          y="500"
          width="270"
          height="155"
        />


        <!-- IDEE & ISPIRAZIONI -->

        <rect
          class="hotspot"
          data-ideas="ideasScreen"
          x="1235"
          y="665"
          width="270"
          height="145"
        />


        <!-- STICKER DI NOZI -->

        <rect
          class="hotspot"
          data-stickers="stickersScreen"
          x="1235"
          y="810"
          width="270"
          height="170"
        />


        <!-- PROGRAMMAZIONE -->

        <rect
          class="hotspot"
          data-target="overlayPlanning"
          x="425"
          y="290"
          width="235"
          height="195"
        />


        <!-- ORARIO -->

        <rect
          class="hotspot"
          data-target="overlaySchedule"
          x="670"
          y="290"
          width="230"
          height="195"
        />


        <!-- DA NON DIMENTICARE -->

        <rect
          class="hotspot"
          data-target="overlayRemember"
          x="915"
          y="290"
          width="235"
          height="195"
        />


        <!-- QUADERNO DELLE COSE BUFFE -->

        <rect
          class="hotspot"
          data-target="overlayNotebook"
          x="790"
          y="580"
          width="330"
          height="245"
        />


        <!-- COMPUTER / ARGO -->

        <rect
          class="hotspot"
          data-url="https://www.portaleargo.it/"
          x="535"
          y="690"
          width="230"
          height="175"
        />

      </svg>

    </div>

  </main>


  <!-- =========================
       PANNELLI ANCORA DI TEST
  ========================== -->

  <div class="overlay" id="overlayLessons">
    <section class="panel">
