<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Base Segreta di Nozi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8f2;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>

  <main class="base">
    <img
      src="assets/base-segreta-nozi.png"
      alt="La Base Segreta di Nozi"
    >
  </main>

</body>
</html>
