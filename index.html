<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    La Base Segreta di Nozi
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>

  <main class="base-stage">

    <div class="base-wrapper">

      <img
        class="base-image"
        src="assets/base-segreta-nozi.png"
        alt="La Base Segreta di Nozi"
      >


      <svg
        class="hotspot-layer"
        viewBox="0 0 1536 1024"
        preserveAspectRatio="none"
      >

        <!-- =========================
             LIBRERIA
        ========================== -->

        <!-- LEZIONI & MATERIALI -->
        <rect
          class="hotspot"
          data-target="overlayLessons"
          x="1235"
          y="170"
          width="270"
          height="155"
        />


        <!-- DOCUMENTI IMPORTANTI -->
        <rect
          class="hotspot"
          data-archive="documentsScreen"
          x="1235"
          y="335"
          width="270"
          height="155"
        />


        <!-- ATTIVITÀ & PROGETTI -->
        <rect
          class="hotspot"
          data-archive="projectsScreen"
          x="1235"
          y="500"
          width="270"
          height="155"
        />


        <!-- IDEE & ISPIRAZIONI -->
        <rect
          class="hotspot"
          data-target="overlayIdeas"
          x="1235"
          y="665"
          width="270"
          height="145"
        />


        <!-- STICKER DI NOZI -->
        <rect
          class="hotspot"
          data-target="overlayStickers"
          x="1235"
          y="810"
          width="270"
          height="170"
        />


        <!-- =========================
             ZONA CENTRALE
        ========================== -->

        <!-- PROGRAMMAZIONE -->
        <rect
          class="hotspot"
          data-target="overlayPlanning"
          x="425"
          y="290"
          width="235"
          height="195"
        />


        <!-- ORARIO SCOLASTICO -->
        <rect
          class="hotspot"
          data-target="overlaySchedule"
          x="670"
          y="290"
          width="230"
          height="195"
        />


        <!-- DA NON DIMENTICARE -->
        <rect
          class="hotspot"
          data-target="overlayRemember"
          x="915"
          y="290"
          width="235"
          height="195"
        />


        <!-- QUADERNO DELLE COSE BUFFE -->
        <rect
          class="hotspot"
          data-target="overlayNotebook"
          x="790"
          y="580"
          width="330"
          height="245"
        />


        <!-- COMPUTER / ARGO -->
        <rect
          class="hotspot"
          data-url="https://www.portaleargo.it/"
          x="535"
          y="690"
          width="230"
          height="175"
        />

      </svg>

    </div>

  </main>


  <!-- =========================
       PANNELLI ANCORA DI TEST
  ========================== -->

  <div
    class="overlay"
    id="overlayLessons"
  >

    <section class="panel">

      <h1>
        Lezioni &amp; Materiali
      </h1>

      <button class="close-button">
        Chiudi
      </button>

    </section>

  </div>


  <div
    class="overlay"
    id="overlayIdeas"
  >

    <section class="panel">

      <h1>
        Idee &amp; Ispirazioni
      </h1>

      <button class="close-button">
        Chiudi
      </button>

    </section>

  </div>


  <div
    class="overlay"
    id="overlayStickers"
  >

    <section class="panel">
