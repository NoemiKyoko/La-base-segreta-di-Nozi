<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Base Segreta di Nozi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8f2;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base-stage {
      position: relative;
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*
      Immagine + hotspot vivono nello stesso contenitore.
      Il contenitore mantiene ESATTAMENTE il rapporto 3:2.
    */
    .base-wrapper {
      position: relative;

      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;
    }

    .base-image {
      display: block;
      width: 100%;
      height: 100%;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /*
      L'SVG ha lo stesso sistema di coordinate
      dell'immagine originale: 1536 × 1024.

      Quindi gli hotspot rimangono attaccati
      agli oggetti anche ruotando l'iPad.
    */
    .hotspot-layer {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 10;
    }

    .hotspot {
      fill: transparent;
      cursor: pointer;
      pointer-events: all;
    }

    .overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(245, 235, 230, 0.68);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      z-index: 100;
    }

    .overlay.aperto {
      display: flex;
    }

    .panel {
      width: min(520px, 82vw);
      padding: 32px;

      background: #fff8f3;
      border: 2px solid #e8b59b;
      border-radius: 28px;

      box-shadow: 0 18px 50px rgba(70, 55, 80, 0.18);

      text-align: center;
    }

    .panel h1 {
      margin: 0 0 24px;

      color: #173f7a;

      font-size: clamp(28px, 4vw, 42px);
    }

    .close-button {
      appearance: none;

      border: 0;
      border-radius: 18px;

      padding: 14px 24px;

      background: #f3c2aa;
      color: #173f7a;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="base-stage">

    <div class="base-wrapper">

      <img
        class="base-image"
        src="assets/base-segreta-nozi.png"
        alt="La Base Segreta di Nozi"
      >

      <svg
        class="hotspot-layer"
        viewBox="0 0 1536 1024"
        preserveAspectRatio="none"
        aria-hidden="true"
      >

        <!-- LEZIONI & MATERIALI -->
        <rect
          id="hotspotLessons"
          class="hotspot"
          x="1235"
          y="170"
          width="270"
          height="155"
        />

      </svg>

    </div>

  </main>

  <div
    class="overlay"
    id="overlayLessons"
  >

    <section class="panel">

      <h1>Lezioni &amp; Materiali</h1>

      <button
        class="close-button"
        id="closeLessons"
      >
        Chiudi
      </button>

    </section>

  </div>

  <script>
    const hotspotLessons =
      document.getElementById("hotspotLessons");

    const overlayLessons =
      document.getElementById("overlayLessons");

    const closeLessons =
      document.getElementById("closeLessons");

    hotspotLessons.addEventListener("click", () => {
      overlayLessons.classList.add("aperto");
    });

    closeLessons.addEventListener("click", () => {
      overlayLessons.classList.remove("aperto");
    });

    overlayLessons.addEventListener("click", (event) => {
      if (event.target === overlayLessons) {
        overlayLessons.classList.remove("aperto");
      }
    });
  </script>

</body>
</html>
