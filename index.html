<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Base Segreta di Nozi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8f2;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base-stage {
      position: relative;
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base-wrapper {
      position: relative;

      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;
    }

    .base-image {
      display: block;
      width: 100%;
      height: 100%;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot-layer {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 10;
    }

    .hotspot {
      fill: transparent;
      cursor: pointer;
      pointer-events: all;
    }

    .overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(245, 235, 230, 0.68);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      z-index: 100;
    }

    .overlay.aperto {
      display: flex;
    }

    .panel {
      width: min(520px, 82vw);
      padding: 32px;

      background: #fff8f3;
      border: 2px solid #e8b59b;
      border-radius: 28px;

      box-shadow: 0 18px 50px rgba(70, 55, 80, 0.18);

      text-align: center;
    }

    .panel h1 {
      margin: 0 0 24px;

      color: #173f7a;

      font-size: clamp(28px, 4vw, 42px);
    }

    .close-button {
      appearance: none;

      border: 0;
      border-radius: 18px;

      padding: 14px 24px;

      background: #f3c2aa;
      color: #173f7a;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="base-stage">

    <div class="base-wrapper">

      <img
        class="base-image"
        src="assets/base-segreta-nozi.png"
        alt="La Base Segreta di Nozi"
      >

      <svg
        class="hotspot-layer"
        viewBox="0 0 1536 1024"
        preserveAspectRatio="none"
      >

        <!-- LEZIONI & MATERIALI -->
        <rect
          class="hotspot"
          data-target="overlayLessons"
          x="1235"
          y="170"
          width="270"
          height="155"
        />

        <!-- DOCUMENTI IMPORTANTI -->
        <rect
          class="hotspot"
          data-target="overlayDocuments"
          x="1235"
          y="335"
          width="270"
          height="155"
        />

      </svg>

    </div>

  </main>


  <!-- LEZIONI & MATERIALI -->

  <div
    class="overlay"
    id="overlayLessons"
  >

    <section class="panel">

      <h1>Lezioni &amp; Materiali</h1>

      <button class="close-button">
        Chiudi
      </button>

    </section>

  </div>


  <!-- DOCUMENTI IMPORTANTI -->

  <div
    class="overlay"
    id="overlayDocuments"
  >

    <section class="panel">

      <h1>Documenti importanti</h1>

      <button class="close-button">
        Chiudi
      </button>

    </section>

  </div>


  <script>

    const hotspots =
      document.querySelectorAll(".hotspot");

    const overlays =
      document.querySelectorAll(".overlay");

    const closeButtons =
      document.querySelectorAll(".close-button");


    hotspots.forEach((hotspot) => {

      hotspot.addEventListener("click", () => {

        const targetId =
          hotspot.dataset.target;

        const targetOverlay =
          document.getElementById(targetId);

        targetOverlay.classList.add("aperto");

      });

    });


    closeButtons.forEach((button) => {

      button.addEventListener("click", () => {

        button
          .closest(".overlay")
          .classList.remove("aperto");

      });

    });


    overlays.forEach((overlay) => {

      overlay.addEventListener("click", (event) => {

        if (event.target === overlay) {
          overlay.classList.remove("aperto");
        }

      });

    });

  </script>

</body>
</html>
