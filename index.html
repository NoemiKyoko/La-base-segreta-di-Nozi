<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Base Segreta di Nozi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8f2;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Questo contenitore ha SEMPRE le stesse proporzioni
       dell'immagine della Base: 3:2 */
    .base-stage {
      position: relative;

      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;

      max-width: 100vw;
      max-height: 100vh;
    }

    .base-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /* LEZIONI & MATERIALI
       Ora queste coordinate sono riferite ALL'IMMAGINE,
       non all'intera schermata. */
    .hotspot-lessons {
      position: absolute;

      left: 79.5%;
      top: 16%;
      width: 18%;
      height: 15%;

      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(245, 235, 230, 0.68);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      z-index: 100;
    }

    .overlay.aperto {
      display: flex;
    }

    .panel {
      width: min(520px, 82vw);
      padding: 32px;

      background: #fff8f3;
      border: 2px solid #e8b59b;
      border-radius: 28px;

      box-shadow: 0 18px 50px rgba(70, 55, 80, 0.18);

      text-align: center;
    }

    .panel h1 {
      margin: 0 0 24px;
      color: #173f7a;
      font-size: clamp(28px, 4vw, 42px);
    }

    .close-button {
      appearance: none;
      border: 0;
      border-radius: 18px;

      padding: 14px 24px;

      background: #f3c2aa;
      color: #173f7a;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="base-stage">

    <img
      class="base-image"
      src="assets/base-segreta-nozi.png"
      alt="La Base Segreta di Nozi"
    >

    <button
      class="hotspot-lessons"
      id="hotspotLessons"
      aria-label="Apri Lezioni e Materiali"
    ></button>

  </main>

  <div class="overlay" id="overlayLessons">

    <section class="panel">
      <h1>Lezioni &amp; Materiali</h1>

      <button
        class="close-button"
        id="closeLessons"
      >
        Chiudi
      </button>
    </section>

  </div>

  <script>
    const hotspotLessons = document.getElementById("hotspotLessons");
    const overlayLessons = document.getElementById("overlayLessons");
    const closeLessons = document.getElementById("closeLessons");

    hotspotLessons.addEventListener("click", () => {
      overlayLessons.classList.add("aperto");
    });

    closeLessons.addEventListener("click", () => {
      overlayLessons.classList.remove("aperto");
    });

    overlayLessons.addEventListener("click", (event) => {
      if (event.target === overlayLessons) {
        overlayLessons.classList.remove("aperto");
      }
    });
  </script>

</body>
</html>
